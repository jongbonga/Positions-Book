<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two Wallets, One Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb; --surface-3:#e8edf3;
  --border:#dbe2ea; --border-strong:#bcc7d3;
  --ink:#0e151c; --ink-2:#495663; --ink-3:#74818e;
  --accent:#1c5cab; --accent-soft:#e2ecfa;
  --good:#0d7048; --warn:#9c5c0a; --crit:#a92e24;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --shadow:0 1px 2px rgba(14,21,28,.05), 0 8px 24px -16px rgba(14,21,28,.28);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0d1116; --surface:#161b21; --surface-2:#1b222a; --surface-3:#222a33;
    --border:#28313b; --border-strong:#3b4650;
    --ink:#eef2f7; --ink-2:#a6b2be; --ink-3:#76828e;
    --accent:#6da7ec; --accent-soft:#17293f;
    --good:#3fae7d; --warn:#d59a33; --crit:#e37b74;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d1116; --surface:#161b21; --surface-2:#1b222a; --surface-3:#222a33;
  --border:#28313b; --border-strong:#3b4650;
  --ink:#eef2f7; --ink-2:#a6b2be; --ink-3:#76828e;
  --accent:#6da7ec; --accent-soft:#17293f;
  --good:#3fae7d; --warn:#d59a33; --crit:#e37b74;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1060px;margin:0 auto;padding:32px 20px 72px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500}

/* ---------- header ---------- */
header{border-bottom:1px solid var(--border-strong);padding-bottom:22px;margin-bottom:26px}
h1{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:clamp(30px,4.4vw,44px);line-height:1.08;letter-spacing:-.015em;margin:8px 0 8px}
.sub{color:var(--ink-2);max-width:62ch;font-size:15.5px}
.stamp{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--ink-3)}
.stamp b{font-weight:600;color:var(--ink-2)}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:36px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 16px 14px;box-shadow:var(--shadow)}
.tile .k{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.tile .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:26px;font-weight:500;letter-spacing:-.02em;margin-top:7px;line-height:1.1}
.tile .n{font-size:12.5px;color:var(--ink-2);margin-top:5px}
.tile.hl{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 32%,transparent)}
.pos{color:var(--good)}

/* ---------- sections ---------- */
section{margin-bottom:40px}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
h2{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:25px;letter-spacing:-.01em}
.lede{color:var(--ink-2);font-size:14.5px;max-width:70ch;margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}

/* ---------- table ---------- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
th{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500;text-align:right;padding:0 0 9px 14px;border-bottom:1px solid var(--border-strong);white-space:nowrap}
th:first-child{text-align:left;padding-left:0}
td{padding:11px 0 11px 14px;border-bottom:1px solid var(--border);text-align:right;vertical-align:middle}
td:first-child{text-align:left;padding-left:0}
tbody tr:last-child td{border-bottom:1px solid var(--border-strong)}
tfoot td{padding-top:12px;font-weight:600;border:0}
.vname{font-weight:600;font-size:14px;letter-spacing:-.005em}
.vsub{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.chip{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--border-strong);color:var(--ink-2);vertical-align:2px;margin-left:7px}
.chip.agg{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.share{display:flex;align-items:center;gap:9px;justify-content:flex-end}
.sbar{width:74px;height:7px;border-radius:3px;background:var(--surface-3);overflow:hidden;flex:none}
.sbar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* ---------- ladder ---------- */
.ladder{position:relative;display:grid;grid-template-columns:168px 1fr 84px;column-gap:14px;row-gap:11px;align-items:center;padding:10px 0 4px}
.rules{position:absolute;left:182px;right:98px;top:0;bottom:26px;pointer-events:none}
.rule{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed color-mix(in srgb,var(--ink-3) 55%,transparent)}
.rule.now{border-left:2px solid var(--good)}
.rule span{position:absolute;top:-4px;transform:translateX(-50%);white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface);padding:0 5px}
.rule.now span{color:var(--good);font-weight:600}
.lrow-l{font-size:12.5px;line-height:1.25}
.lrow-l b{font-weight:600;font-size:13px}
.lrow-l em{display:block;font-style:normal;color:var(--ink-3);font-size:11px}
.track{position:relative;height:22px}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--border);transform:translateY(-50%)}
.dot{position:absolute;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:var(--s1);border:2px solid var(--surface);cursor:default}
.lrow-r{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:13px;text-align:right;font-weight:500}
.axis{grid-column:2;display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);padding-top:4px}

/* ---------- stacked look-through ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 18px;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.sw{width:11px;height:11px;border-radius:3px;flex:none}
.stackrow{display:grid;grid-template-columns:172px 1fr;column-gap:14px;align-items:center;margin-bottom:11px}
.stackrow.total{margin-top:16px;padding-top:16px;border-top:1px solid var(--border-strong)}
.slabel{font-size:12.5px;line-height:1.25}
.slabel b{font-weight:600;font-size:13px;display:block}
.slabel em{font-style:normal;color:var(--ink-3);font-size:11px;font-family:"IBM Plex Mono",monospace}
.stack{display:flex;gap:2px;height:30px;border-radius:5px;overflow:hidden}
.stackrow.total .stack{height:42px}
.seg{display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;color:#fff;overflow:hidden;min-width:2px;cursor:default}
.seg.dk{color:#12181e}
.seg .mini{display:none}

/* ---------- dumbbell ---------- */
.dumb{display:grid;grid-template-columns:172px 1fr 88px;column-gap:14px;row-gap:13px;align-items:center;padding-top:4px}
.dtrack{position:relative;height:24px}
.dtrack::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--border);transform:translateY(-50%)}
.conn{position:absolute;top:50%;height:3px;transform:translateY(-50%);background:color-mix(in srgb,var(--warn) 55%,transparent);border-radius:2px}
.pt{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%)}
.pt.avg{background:var(--surface);border:2.5px solid var(--ink-3)}
.pt.now{background:var(--accent);border:2px solid var(--surface)}
.ddelta{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:12.5px;text-align:right;font-weight:600;color:var(--warn)}

/* ---------- findings ---------- */
.finds{display:grid;gap:12px}
.find{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--ink-3);border-radius:var(--r);box-shadow:var(--shadow);padding:17px 19px}
.find.w{border-left-color:var(--warn)}
.find.g{border-left-color:var(--good)}
.find h3{font-size:15.5px;font-weight:700;letter-spacing:-.005em;margin-bottom:5px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tag{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:999px;font-weight:600}
.find.w .tag{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.find.g .tag{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.find .tag.n{background:var(--surface-3);color:var(--ink-2)}
.find p{margin:0;color:var(--ink-2);font-size:14px;max-width:76ch}
.find p + p{margin-top:8px}
.find b{color:var(--ink);font-weight:600}

footer{border-top:1px solid var(--border-strong);padding-top:20px;color:var(--ink-3);font-size:12.5px;max-width:78ch}
footer p{margin:0 0 9px}
details summary{cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:16px}
details summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
details[open] summary{margin-bottom:12px}
#tip{position:fixed;z-index:50;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--ink);color:var(--bg);font-family:"IBM Plex Mono",monospace;font-size:11.5px;padding:6px 9px;border-radius:6px;white-space:nowrap;box-shadow:0 6px 20px -8px rgba(0,0,0,.5)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:620px){
  .ladder{grid-template-columns:112px 1fr 66px;column-gap:10px}
  .rules{left:122px;right:76px;bottom:30px}
  .rule span{font-size:9px;padding:0 3px}
  .rule:not(.now) span{top:auto;bottom:-6px}
  .axis span:nth-child(2),.axis span:nth-child(4){display:none}
  .stackrow,.dumb{grid-template-columns:112px 1fr;column-gap:10px}
  .stackrow:not(.total) .seg{font-size:0}
  .seg .full{display:none}
  .seg .mini{display:inline}
  .ddelta{grid-column:2;text-align:left;margin-top:-7px}
}

/* ---------- waterfall ---------- */
.wf{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:end;padding:8px 0 0}
.wf-col{display:flex;flex-direction:column;align-items:center;gap:9px}
.wf-track{position:relative;width:100%;height:210px}
.wf-track::after{content:"";position:absolute;left:-9px;right:-9px;bottom:0;height:1px;background:var(--border-strong)}
.wf-bar{position:absolute;left:20%;right:20%;border-radius:4px}
.wf-val{position:absolute;left:0;right:0;text-align:center;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;white-space:nowrap}
.wf-lab{font-size:12.5px;text-align:center;line-height:1.3}
.wf-lab b{display:block;font-weight:600;font-size:13px}
.wf-lab em{font-style:normal;color:var(--ink-3);font-size:11px;font-family:"IBM Plex Mono",monospace}
.gain{background:var(--good)} .loss{background:var(--crit)} .netb{background:var(--accent)}
.tgain{color:var(--good)} .tloss{color:var(--crit)} .tnet{color:var(--accent)}

/* ---------- diverging paired bars ---------- */
.dv{display:grid;grid-template-columns:150px 1fr;column-gap:14px;row-gap:14px;align-items:center}
.dv-track{position:relative;height:38px}
.dv-track::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--border-strong)}
.dv-bar{position:absolute;height:14px;border-radius:3px}
.dv-bar.up{top:2px;left:50%;background:var(--s1)}
.dv-bar.dn{bottom:2px;right:50%;background:var(--crit)}
.dv-t{position:absolute;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;line-height:14px;white-space:nowrap}
.dv-t.up{top:2px;color:var(--s1)} .dv-t.dn{bottom:2px;color:var(--crit)}
.dv-ax{grid-column:2;display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}

/* ---------- band meters ---------- */
.bandrow{display:grid;grid-template-columns:132px 1fr 118px;column-gap:14px;row-gap:0;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.bandrow:last-of-type{border-bottom:0}
.meter{position:relative;height:26px}
.meter-rail{position:absolute;left:0;right:0;top:50%;height:6px;transform:translateY(-50%);background:var(--surface-3);border-radius:3px}
.meter-band{position:absolute;top:50%;height:14px;transform:translateY(-50%);background:color-mix(in srgb,var(--good) 22%,transparent);border-left:2px solid color-mix(in srgb,var(--good) 60%,transparent);border-right:2px solid color-mix(in srgb,var(--good) 60%,transparent);border-radius:2px}
.meter-now{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);transform:translate(-50%,-50%)}
.bandnum{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:12px;text-align:right;color:var(--ink-2)}

/* ---------- venue heading inside table ---------- */
tr.grp td{padding-top:18px;padding-bottom:7px;border-bottom:1px solid var(--border-strong);font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:left;font-weight:500}
tr.grp:first-child td{padding-top:0}
.neg{color:var(--crit)}
/* ---------- pair cards ---------- */
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.pair{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:17px 18px 16px}
.pair-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:3px}
.pair-h b{font-size:15px;font-weight:700;letter-spacing:-.005em}
.pair-h span{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600}
.pair-sub{font-size:11.5px;color:var(--ink-3);margin-bottom:14px}
.plab{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-2);margin-bottom:5px}
.plab b{font-weight:600}
.split{position:relative;display:flex;gap:2px;height:26px;border-radius:5px;overflow:visible;margin-bottom:5px}
.split .a,.split .b{display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:#fff;overflow:hidden}
.split .a{background:var(--s1);border-radius:5px 0 0 5px}
.split .b{background:var(--s2);border-radius:0 5px 5px 0}
.entry{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dotted var(--ink-2);z-index:2}
.entry em{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;background:var(--surface);padding:0 4px}
.amts{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);margin-bottom:16px}
.rng{position:relative;height:22px;margin-bottom:5px}
.rng-rail{position:absolute;left:0;right:0;top:50%;height:6px;transform:translateY(-50%);background:linear-gradient(90deg,color-mix(in srgb,var(--crit) 30%,transparent),var(--surface-3) 25%,var(--surface-3) 75%,color-mix(in srgb,var(--crit) 30%,transparent));border-radius:3px}
.rng-now{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);transform:translate(-50%,-50%);z-index:2}
.rng-lab{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3)}
.hold{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--ink-2)}
.hold b{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600}
.gcell{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.gpct{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600}
.mb{position:relative;width:78px;height:6px;background:var(--surface-3);border-radius:3px}
.mb::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--border-strong)}
.mb i{position:absolute;top:0;height:6px;border-radius:2px}
.mb i.up{left:50%;background:var(--good)}
.mb i.dn{right:50%;background:var(--crit)}
tr.sub td{border-bottom:1px solid var(--border-strong);font-weight:600;background:var(--surface-2)}
tr.sub td:first-child{font-size:12.5px;color:var(--ink-2)}
@media (max-width:620px){
  .wf{gap:9px}
  .wf-track{height:170px}
  .wf-val{font-size:11px}
  .dv{grid-template-columns:104px 1fr;column-gap:9px}
  .bandrow{grid-template-columns:96px 1fr;row-gap:6px}
  .bandnum{grid-column:2;text-align:left}
}

/* ---------- live-page additions ---------- */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
button,.btn{font:inherit;font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);cursor:pointer}
button:hover{background:var(--surface-2)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.08)}
input,textarea{font:inherit;font-size:13.5px;padding:8px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);width:100%}
textarea{font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.5;min-height:150px;resize:vertical}
label{display:block;font-size:12px;color:var(--ink-2);margin:0 0 5px;font-weight:500}
.field{margin-bottom:14px}
.setup{max-width:640px;margin:60px auto;padding:26px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.setup h2{margin-bottom:6px}
.muted{color:var(--ink-3);font-size:12.5px}
.err{color:var(--crit);font-size:12.5px;margin-top:8px}
.state{padding:60px 20px;text-align:center;color:var(--ink-2)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.warnbox{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:8px;padding:12px 14px;margin-bottom:18px;font-size:13.5px;color:var(--ink-2)}
.basis-grid{display:grid;grid-template-columns:1fr 130px;gap:8px 12px;align-items:center;font-size:13px}
.basis-grid .lbl{color:var(--ink-2)}
.basis-grid input{text-align:right;font-family:"IBM Plex Mono",monospace}
dialog{border:none;border-radius:var(--r);padding:0;background:transparent;max-width:min(640px,92vw)}
dialog::backdrop{background:rgba(10,15,20,.55)}

.rowsplit{display:flex;gap:10px;flex-wrap:wrap}
.rowsplit>*{flex:1;min-width:200px}
.stale{color:var(--warn)}
</style>

  <div class="state"><span class="spin"></span>Loading…</div>
</div>

<dialog id="settings"><form method="dialog" class="sheet" id="settingsForm"></form></dialog>
<script>
(function(){
'use strict';

/* ---------------- config ---------------- */
var CFG_KEY='twowallets.cfg.v1';
var KAMINO_REGISTRY=[
 {addr:'5YxwKgsvyTdT8q2CBgwA4L9BKbnKNrB66K9wUzij5wH',name:'Elemental SOL Optimizer',curator:'Elemental',style:'Aggressive',token:'SOL',group:'sol'},
 {addr:'A1so1bPD3W1TfeFwboDh8yfAAVaVtcdAYBYCjhg2mJQ',name:'Allez SOL',curator:'Allez Labs',style:'Balanced',token:'SOL',group:'sol'},
 {addr:'QAYtEKciq4gc42K683rTaWu3JxqceA7JkEkZxwWUWBo',name:'MEV Capital SOL',curator:'MEV Capital',style:'Balanced',token:'SOL',group:'sol'},
 {addr:'DcCRSdUMgAt6ZMeuL4BJAsZmJgND2LQd74Zq4z6ckhpg',name:'Gauntlet SOL Balanced',curator:'Gauntlet',style:'Balanced',token:'SOL',group:'sol'},
 {addr:'A2wsxhA7pF4B2UKVfXocb6TAAP9ipfPJam6oMKgDE5BK',name:'Sentora PYUSD',curator:'Sentora',style:'Balanced',token:'PYUSD',group:'stable'},
 {addr:'DJbRxuBckoJpFVUNtWx94NghcthfGaRV5NRmEazUaddE',name:'Elemental USDG Optimizer',curator:'Elemental',style:'Aggressive',token:'USDG',group:'stable'},
 {addr:'BoZDRc1RDY9FzUZZ19WT4GbtTnnbXQ8AGSU5ByEw3ut5',name:'Steakhouse USDG High Yield',curator:'Steakhouse',style:'Balanced',token:'USDG',group:'stable'}
];
var RPCS=['https://bsc.publicnode.com','https://bsc-dataseed1.defibit.io','https://bsc-rpc.publicnode.com'];
var STABLES={USDT:1,USDC:1,PYUSD:1,USDG:1,BUSD:1,DAI:1,FDUSD:1,USD1:1};

function loadCfg(){
  var raw=null; try{raw=localStorage.getItem(CFG_KEY);}catch(e){}
  var c=raw?JSON.parse(raw):{};
  return {sol:c.sol||'',bnb:c.bnb||'',basis:c.basis||{},extraKamino:c.extraKamino||[],beefyIds:c.beefyIds||null};
}
function saveCfg(c){ try{localStorage.setItem(CFG_KEY,JSON.stringify(c));}catch(e){} }
var cfg=loadCfg();

/* ---------------- helpers ---------------- */
var app=document.getElementById('app');
function el(h){var d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function usd(n,dp){ if(n==null||!isFinite(n))return '—';
  var s=Math.abs(n)>=1000||dp===0?Math.round(n).toLocaleString('en-US'):Math.abs(n).toFixed(dp==null?2:dp);
  if(Math.abs(n)>=1000||dp===0)s=Math.abs(Math.round(n)).toLocaleString('en-US');
  return (n<0?'−$':'$')+s; }
function sgn(n){ if(n==null||!isFinite(n))return '—'; return (n>=0?'+':'−')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US'); }
function pct(n,dp){ if(n==null||!isFinite(n))return '—'; return (n>=0?'+':'−')+Math.abs(n).toFixed(dp==null?2:dp)+'%'; }
function num(n,dp){ if(n==null||!isFinite(n))return '—'; return n.toLocaleString('en-US',{minimumFractionDigits:dp==null?2:dp,maximumFractionDigits:dp==null?2:dp}); }
function sig(n){ if(n==null||!isFinite(n))return '—';
  var a=Math.abs(n); if(a===0)return '0';
  if(a>=1000)return n.toLocaleString('en-US',{maximumFractionDigits:0});
  if(a>=1)return n.toFixed(a>=100?1:2);
  if(a>=0.01)return n.toFixed(4);
  var d=Math.min(12,Math.ceil(-Math.log10(a))+3); return n.toFixed(d); }
function cls(n){return n>=0?'tgain':'neg';}
async function jget(u){var r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(u.split('/').slice(2,3)+' '+r.status);return r.json();}

/* ---------------- EVM ---------------- */
var rpcIdx=0;
async function rpcBatch(calls){
  if(!calls.length)return [];
  var body=calls.map(function(c,i){return {jsonrpc:'2.0',id:i,method:'eth_call',params:[{to:c.to,data:c.data},'latest']};});
  var lastErr;
  for(var t=0;t<RPCS.length;t++){
    var url=RPCS[(rpcIdx+t)%RPCS.length];
    try{
      var r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
      var j=await r.json();
      if(!Array.isArray(j))throw new Error('bad batch response');
      var m={}; j.forEach(function(x){m[x.id]=x.result;});
      rpcIdx=(rpcIdx+t)%RPCS.length;
      return calls.map(function(c,i){return m[i]||null;});
    }catch(e){lastErr=e;}
  }
  throw lastErr||new Error('rpc failed');
}
function padAddr(a){return '000000000000000000000000'+String(a).toLowerCase().replace(/^0x/,'');}
function words(hex){ if(!hex||hex==='0x')return []; var h=hex.replace(/^0x/,''); var o=[]; for(var i=0;i<h.length;i+=64)o.push(h.slice(i,i+64)); return o; }
function big(w){ return w?BigInt('0x'+w):0n; }
function toNum(bi,dec){ return Number(bi)/Math.pow(10,dec); }
function addrOf(w){ return w?('0x'+w.slice(24)):null; }
var SEL={balanceOf:'0x70a08231',totalSupply:'0x18160ddd',balances:'0x7bb98a68',wants:'0x65844934',strategy:'0xa8c62e76',price:'0xa035b1fe',range:'0xe97206a9',ppfs:'0x77c7b8fc',decimals:'0x313ce567'};

/* ---------------- Kamino ---------------- */
async function loadKamino(wallet){
  var reg=KAMINO_REGISTRY.concat((cfg.extraKamino||[]).map(function(a){
    return typeof a==='string'?{addr:a,name:a.slice(0,6)+'…',curator:'',style:'',token:'',group:'other'}:a;}));
  var end=new Date().toISOString();
  var start=new Date(Date.now()-6*3600*1000).toISOString();
  var out=[];
  await Promise.all(reg.map(async function(v){
    try{
      var m=await jget('https://api.kamino.finance/kvaults/'+v.addr+'/metrics');
      var h=await jget('https://api.kamino.finance/kvaults/'+v.addr+'/users/'+wallet+'/metrics/history?start='+encodeURIComponent(start)+'&end='+encodeURIComponent(end));
      if(!h.length){
        var s2=new Date(Date.now()-30*86400000).toISOString();
        h=await jget('https://api.kamino.finance/kvaults/'+v.addr+'/users/'+wallet+'/metrics/history?start='+encodeURIComponent(s2)+'&end='+encodeURIComponent(end));
      }
      var last=h[h.length-1];
      if(!last)return;
      var value=Number(last.usdAmount);
      if(!(value>0.5))return;
      var price=Number(m.tokenPrice);
      out.push({
        id:'kamino:'+v.addr, venue:'Kamino', chain:'Solana', meta:v, group:v.group,
        name:v.name, sub:(v.curator||'')+(v.style?'':''), style:v.style, curator:v.curator,
        token:v.token||'', tokenAmount:price?value/price:null, tokenPrice:price,
        shares:Number(last.sharesAmount), value:value,
        apy:Number(m.apy), asOf:last.createdOn,
        earned:Number(last.cumulativeInterestEarnedUsd||0)
      });
    }catch(e){ out.push({id:'kamino:'+v.addr,error:String(e.message||e),name:v.name,venue:'Kamino'}); }
  }));
  return out;
}

/* ---------------- cost basis from Kamino history ---------------- */
function kaminoRegistry(){
  return KAMINO_REGISTRY.concat((cfg.extraKamino||[]).map(function(a){
    return typeof a==='string'?{addr:a,name:a.slice(0,6)+'…',curator:'',style:'',token:'',group:'other'}:a;}));
}
async function deriveKaminoBasis(wallet,vaults,onProgress){
  var endT=new Date().toISOString(), startT=new Date(Date.now()-3*365*86400000).toISOString();
  var res={};
  for(var i=0;i<vaults.length;i++){
    var v=vaults[i];
    if(onProgress)onProgress(i,vaults.length,v.name);
    var base='https://api.kamino.finance/kvaults/'+v.addr+'/users/'+wallet;
    var hist=null,pnl=null;
    try{ hist=await jget(base+'/metrics/history?start='+encodeURIComponent(startT)+'&end='+encodeURIComponent(endT)); }catch(e){}
    try{ pnl=await jget(base+'/pnl'); }catch(e){}
    var last=(hist&&hist.length)?hist[hist.length-1]:null;
    var value=last?Number(last.usdAmount):null;
    if(!(value>0.5))continue;
    var walk=hist?walkKaminoHistory(hist):null;
    var reported=(pnl&&pnl.totalCostBasis)?Number(pnl.totalCostBasis.usd):NaN;
    var ratio=(isFinite(reported)&&reported>0)?reported/value:0;
    var pick=null,method=null;
    if(ratio>0.2&&ratio<5){ pick=reported; method='kamino'; }
    else if(walk&&walk.cost>0){ pick=walk.cost; method='history'; }
    if(pick==null)continue;
    res['kamino:'+v.addr]={cost:pick,method:method,name:v.name,value:value,
      deposits:walk?walk.deposits:null,withdrawals:walk?walk.withdrawals:null,
      since:walk?walk.since:null,openingBalance:walk?walk.openingBalance:false};
  }
  return res;
}
function walkKaminoHistory(h){
  var cost=0,shares=0,dep=0,wd=0,first=null,opening=false;
  for(var k=0;k<h.length;k++){
    var p=h[k], sh=Number(p.sharesAmount), usd=Number(p.usdAmount);
    if(!isFinite(sh)||!isFinite(usd))continue;
    var pps=sh>0?usd/sh:0;
    if(first===null){ first=p.createdOn; if(sh>0){cost=usd;shares=sh;dep=1;opening=true;} continue; }
    if(shares<=0){ if(sh>0){cost+=sh*pps;shares=sh;dep++;} continue; }
    var rel=(sh-shares)/shares;
    if(rel>0.0005){ cost+=(sh-shares)*pps; dep++; }
    else if(rel<-0.0005){ cost*=sh/shares; wd++; }
    shares=sh;
  }
  return (shares>0&&cost>0)?{cost:cost,deposits:dep,withdrawals:wd,since:first,openingBalance:opening}:null;
}

/* ---------------- Beefy ---------------- */
async function loadBeefy(wallet,forceScan){
  var lists=await Promise.all([
    jget('https://api.beefy.finance/cow-vaults/bsc').catch(function(){return [];}),
    jget('https://api.beefy.finance/gov-vaults/bsc').catch(function(){return [];}),
    jget('https://api.beefy.finance/vaults/bsc').catch(function(){return [];})
  ]);
  var all=[]
    .concat(lists[0].map(function(v){v.kind='clm';return v;}))
    .concat(lists[1].map(function(v){v.kind='pool';return v;}))
    .concat(lists[2].map(function(v){v.kind='vault';return v;}))
    .filter(function(v){return v && v.earnContractAddress;});
  var byId={}; all.forEach(function(v){byId[v.id]=v;});
  var seen={},uniq=[];
  all.forEach(function(v){var k=v.earnContractAddress.toLowerCase();if(!seen[k]){seen[k]=1;uniq.push(v);}});

  var candidates;
  if(!forceScan && cfg.beefyIds && cfg.beefyIds.length){
    candidates=cfg.beefyIds.map(function(id){return byId[id];}).filter(Boolean);
    if(!candidates.length)candidates=uniq;
  } else candidates=uniq;

  var held=[];
  for(var i=0;i<candidates.length;i+=200){
    var chunk=candidates.slice(i,i+200);
    var res=await rpcBatch(chunk.map(function(v){return {to:v.earnContractAddress,data:SEL.balanceOf+padAddr(wallet)};}));
    chunk.forEach(function(v,k){
      var r=res[k];
      if(r&&/^0x[0-9a-f]+$/i.test(r)&&big(words(r)[0])>0n) held.push({v:v,raw:big(words(r)[0])});
    });
  }
  cfg.beefyIds=held.map(function(h){return h.v.id;}); saveCfg(cfg);
  if(!held.length)return [];

  var lps={},prices={},apys={};
  try{lps=await jget('https://api.beefy.finance/lps');}catch(e){}
  try{prices=await jget('https://api.beefy.finance/prices');}catch(e){}
  try{apys=await jget('https://api.beefy.finance/apy');}catch(e){}

  /* resolve the CLM contract behind each holding */
  var out=[];
  for(var h=0;h<held.length;h++){
    var v=held[h].v, rawShares=held[h].raw;
    var pos={id:'beefy:'+v.id, venue:'Beefy', chain:'BNB Chain', name:v.name, vaultId:v.id,
      platform:v.tokenProviderId||v.platformId||'', kindLabel:v.kind==='pool'?'CLM Pool':(v.kind==='vault'?'CLM Vault':'CLM'),
      assets:v.assets||[], group:'beefy', apy:null, value:null};
    try{
      var clm=(v.kind==='vault'||v.kind==='pool')?v.tokenAddress:v.earnContractAddress;
      var clmShares;
      if(v.kind==='vault'){
        var pp=await rpcBatch([{to:v.earnContractAddress,data:SEL.ppfs}]);
        var ppfs=Number(big(words(pp[0])[0]))/1e18;
        clmShares=Number(rawShares)/1e18*ppfs; pos.ppfs=ppfs;
      } else clmShares=Number(rawShares)/1e18;
      pos.lpUnits=clmShares;

      var base=await rpcBatch([
        {to:clm,data:SEL.totalSupply},{to:clm,data:SEL.balances},
        {to:clm,data:SEL.wants},{to:clm,data:SEL.strategy}
      ]);
      var supply=Number(big(words(base[0])[0]))/1e18;
      var bw=words(base[1]), t0=addrOf(words(base[2])[0]), t1=addrOf(words(base[2])[1]);
      var strat=addrOf(words(base[3])[0]);
      var frac=supply>0?clmShares/supply:0;
      pos.frac=frac;

      var dec=await rpcBatch([{to:t0,data:SEL.decimals},{to:t1,data:SEL.decimals}]);
      var d0=Number(big(words(dec[0])[0]))||18, d1=Number(big(words(dec[1])[0]))||18;
      var amt0=toNum(big(bw[0]),d0)*frac, amt1=toNum(big(bw[1]),d1)*frac;
      var s0=(v.assets&&v.assets[0])||'', s1=(v.assets&&v.assets[1])||'';
      var p0=prices[s0], p1=prices[s1];
      pos.tokens=[{sym:s0,amt:amt0,price:p0,usd:p0!=null?amt0*p0:null},{sym:s1,amt:amt1,price:p1,usd:p1!=null?amt1*p1:null}];

      var lpPrice=lps[v.oracleId]!=null?lps[v.oracleId]:lps[v.id];
      var byToken=(p0!=null&&p1!=null)?(amt0*p0+amt1*p1):null;
      pos.value=byToken!=null?byToken:(lpPrice!=null?clmShares*lpPrice:null);
      pos.valueAlt=lpPrice!=null?clmShares*lpPrice:null;

      if(strat&&/^0x[0-9a-f]{40}$/i.test(strat)&&strat!=='0x0000000000000000000000000000000000000000'){
        var rr=await rpcBatch([{to:strat,data:SEL.price},{to:strat,data:SEL.range}]);
        if(rr[0]&&rr[0]!=='0x')pos.price=Number(big(words(rr[0])[0]))/1e36;
        if(rr[1]&&rr[1]!=='0x'){var rw=words(rr[1]);pos.rangeLo=Number(big(rw[0]))/1e36;pos.rangeHi=Number(big(rw[1]))/1e36;}
        if(pos.price!=null&&pos.rangeLo!=null&&pos.rangeHi>pos.rangeLo){
          pos.rangePos=(pos.price-pos.rangeLo)/(pos.rangeHi-pos.rangeLo);
          pos.inRange=pos.price>=pos.rangeLo&&pos.price<=pos.rangeHi;
        }
      }
      var a=apys[v.id]; if(a==null)a=apys[v.oracleId];
      pos.apy=(a!=null&&isFinite(a))?a:null;
    }catch(e){ pos.error=String(e.message||e); }
    out.push(pos);
  }
  return out;
}

/* ---------------- compute ---------------- */
function build(kam,bee){
  var pos=kam.filter(function(p){return !p.error;}).concat(bee.filter(function(p){return !p.error;}));
  var errs=kam.concat(bee).filter(function(p){return p.error;});
  pos.forEach(function(p){
    var c=cfg.basis[p.id];
    p.cost=(c!=null&&isFinite(c))?Number(c):null;
    p.gain=(p.cost!=null&&p.value!=null)?p.value-p.cost:null;
    p.gainPct=(p.cost>0&&p.gain!=null)?p.gain/p.cost*100:null;
    p.daily=(p.apy!=null&&p.value!=null)?p.value*p.apy/365:null;
  });
  var groups={sol:[],stable:[],beefy:[],other:[]};
  pos.forEach(function(p){ (groups[p.group]||groups.other).push(p); });
  function sum(a,f){return a.reduce(function(s,p){var v=f(p);return s+(v==null||!isFinite(v)?0:v);},0);}
  var total=sum(pos,function(p){return p.value;});
  var cost=sum(pos,function(p){return p.cost;});
  var covered=pos.filter(function(p){return p.cost!=null;});
  var gain=sum(covered,function(p){return p.gain;});
  return {pos:pos,errs:errs,groups:groups,total:total,cost:cost,gain:gain,
    haveBasis:covered.length>0, fullBasis:covered.length===pos.length,
    daily:sum(pos,function(p){return p.daily;}), sum:sum};
}

/* ---------------- exposure look-through ---------------- */
function exposures(m){
  var buckets={};
  function add(k,v,note){ if(v==null||!isFinite(v))return; if(!buckets[k])buckets[k]={usd:0,notes:{}}; buckets[k].usd+=v; if(note)buckets[k].notes[note]=1; }
  m.groups.sol.forEach(function(p){add('SOL',p.value,p.name);});
  m.groups.stable.forEach(function(p){add('Stablecoins',p.value,p.token||p.name);});
  m.groups.beefy.forEach(function(p){
    (p.tokens||[]).forEach(function(t){
      if(t.usd==null)return;
      var k=STABLES[t.sym]?'Stablecoins':(t.sym==='WBNB'||t.sym==='BNB'?'BNB':(t.sym==='BTCB'||t.sym==='BTC'?'BTC':t.sym));
      add(k,t.usd,p.name);
    });
  });
  var rows=Object.keys(buckets).map(function(k){return {name:k,usd:buckets[k].usd,notes:Object.keys(buckets[k].notes)};});
  rows.sort(function(a,b){return b.usd-a.usd;});
  var big=rows.filter(function(r){return r.usd/m.total>=0.02;});
  var small=rows.filter(function(r){return r.usd/m.total<0.02;});
  if(small.length){ big.push({name:small.map(function(s){return s.name;}).join(' · '),usd:small.reduce(function(s,r){return s+r.usd;},0),notes:['small positions'],small:true}); }
  return big;
}

/* ---------------- render ---------------- */
function shortAddr(a){return a?a.slice(0,4)+'…'+a.slice(-4):'—';}

function renderSetup(msg){
  app.innerHTML='';
  app.appendChild(el('<div class="setup">'+
    '<div class="eyebrow">First run</div>'+
    '<h2>Two wallets, one book</h2>'+
    '<p class="lede">Paste the two addresses this page should read. They are stored in this browser only — never in the repository, never sent anywhere except the Kamino API and a public BNB Chain RPC node.</p>'+
    (msg?'<div class="err">'+esc(msg)+'</div>':'')+
    '<div class="field"><label>Solana wallet (Kamino)</label><input id="s_sol" placeholder="2g7t…" value="'+esc(cfg.sol)+'"></div>'+
    '<div class="field"><label>BNB Chain wallet (Beefy)</label><input id="s_bnb" placeholder="0x…" value="'+esc(cfg.bnb)+'"></div>'+
    '<div class="field"><label>Cost basis &amp; settings (optional JSON)</label><textarea id="s_json" placeholder=\'{"basis":{"kamino:5Yxw…":14071}}\'></textarea>'+
    '<p class="muted">Optional. You can also fill cost basis in per position later — without it the page shows live values and no gain columns.</p></div>'+
    '<div class="bar"><button class="primary" id="s_go">Load the book</button></div>'+
    '</div>'));
  document.getElementById('s_go').onclick=function(){
    var sol=document.getElementById('s_sol').value.trim();
    var bnb=document.getElementById('s_bnb').value.trim();
    var js=document.getElementById('s_json').value.trim();
    if(bnb&&!/^0x[0-9a-fA-F]{40}$/.test(bnb))return renderSetup('That BNB Chain address does not look right — it should be 0x plus 40 hex characters.');
    if(sol&&!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(sol))return renderSetup('That Solana address does not look like a base58 public key.');
    if(!sol&&!bnb)return renderSetup('Give me at least one of the two addresses.');
    cfg.sol=sol;cfg.bnb=bnb;
    if(js){ try{var o=JSON.parse(js); if(o.basis)cfg.basis=o.basis; if(o.sol)cfg.sol=o.sol; if(o.bnb)cfg.bnb=o.bnb; if(o.extraKamino)cfg.extraKamino=o.extraKamino; }
      catch(e){ return renderSetup('That JSON did not parse: '+e.message); } }
    cfg.beefyIds=null; saveCfg(cfg); run();
  };
}

function tile(k,v,n,hl,c){
  return '<div class="tile'+(hl?' hl':'')+'"><div class="k">'+esc(k)+'</div><div class="v'+(c?' '+c:'')+'">'+v+'</div><div class="n">'+n+'</div></div>';
}

function waterfall(m){
  var steps=[];
  function grp(list,label,sub){
    var withCost=list.filter(function(p){return p.gain!=null;});
    if(!withCost.length)return;
    var g=m.sum(withCost,function(p){return p.gain;});
    var c=m.sum(withCost,function(p){return p.cost;});
    steps.push({label:label,sub:sub||(c>0?pct(g/c*100)+' on cost':''),val:g});
  }
  grp(m.groups.sol,'Kamino SOL');
  grp(m.groups.stable,'Kamino stables','interest earned');
  grp(m.groups.beefy,'Beefy');
  m.groups.other.forEach(function(p){ if(p.gain!=null)steps.push({label:p.name,sub:'',val:p.gain}); });
  if(steps.length<2)return '';
  var cum=[],c=0;
  steps.forEach(function(s){var from=c;c+=s.val;cum.push([from,c]);});
  var net=c;
  var scale=Math.max.apply(null,cum.map(function(p){return Math.max(Math.abs(p[0]),Math.abs(p[1]));}).concat([Math.abs(net)]))*1.14||1;
  var cols=steps.map(function(s,i){
    var a=cum[i][0],b=cum[i][1];
    var lo=Math.min(a,b),hi=Math.max(a,b);
    var bottom=lo/scale*100, height=(hi-lo)/scale*100;
    return '<div class="wf-col"><div class="wf-track">'+
      '<div class="wf-bar '+(s.val>=0?'gain':'loss')+'" style="bottom:'+bottom.toFixed(1)+'%;height:'+Math.max(height,0.6).toFixed(1)+'%"></div>'+
      '<div class="wf-val '+(s.val>=0?'tgain':'tloss')+'" style="bottom:'+Math.min(hi/scale*100+1.2,95).toFixed(1)+'%">'+sgn(s.val)+'</div>'+
      '</div><div class="wf-lab"><b>'+esc(s.label)+'</b><em>'+esc(s.sub)+'</em></div></div>';
  }).join('');
  cols+='<div class="wf-col"><div class="wf-track">'+
    '<div class="wf-bar netb" style="bottom:'+Math.min(0,net/scale*100).toFixed(1)+'%;height:'+Math.abs(net/scale*100).toFixed(1)+'%"></div>'+
    '<div class="wf-val tnet" style="bottom:'+Math.min(Math.abs(net)/scale*100+1.2,95).toFixed(1)+'%">'+sgn(net)+'</div>'+
    '</div><div class="wf-lab"><b>Net</b><em>all positions</em></div></div>';
  return '<div class="card"><div class="wf">'+cols+'</div></div>';
}

function positionsTable(m){
  var rows='';
  function group(list,title){
    if(!list.length)return;
    rows+='<tr class="grp"><td colspan="7">'+esc(title)+'</td></tr>';
    list.sort(function(a,b){return (b.value||0)-(a.value||0);});
    list.forEach(function(p){
      var sub=[];
      if(p.tokenAmount!=null&&p.token)sub.push(sig(p.tokenAmount)+' '+p.token);
      if(p.lpUnits!=null)sub.push(sig(p.lpUnits)+' LP');
      if(p.curator)sub.push(p.curator);
      if(p.platform)sub.push(p.platform);
      if(p.inRange===false)sub.push('OUT OF RANGE');
      rows+='<tr><td><span class="vname">'+esc(p.name)+'</span>'+
        (p.style||p.kindLabel?'<span class="chip'+(p.style==='Aggressive'?' agg':'')+'">'+esc(p.style||p.kindLabel)+'</span>':'')+
        '<div class="vsub">'+esc(sub.join(' · '))+'</div></td>'+
        '<td class="num">'+(p.cost!=null?usd(p.cost,0):'—')+'</td>'+
        '<td class="num">'+usd(p.value,0)+'</td>'+
        '<td class="num '+(p.gain!=null?cls(p.gain):'')+'">'+(p.gain!=null?sgn(p.gain):'—')+'</td>'+
        '<td class="num '+(p.gainPct!=null?cls(p.gainPct):'')+'">'+(p.gainPct!=null?pct(p.gainPct):'—')+'</td>'+
        '<td class="num">'+(m.total?(p.value/m.total*100).toFixed(1)+'%':'—')+'</td>'+
        '<td class="num">'+(p.apy!=null?(p.apy*100).toFixed(2)+'%':'—')+'</td></tr>';
    });
    if(list.length>1){
      var v=m.sum(list,function(p){return p.value;}), c=m.sum(list.filter(function(p){return p.cost!=null;}),function(p){return p.cost;});
      var any=list.some(function(p){return p.cost!=null;});
      var g=v-c;
      rows+='<tr class="sub"><td>Subtotal · '+esc(title.split('·').pop().trim())+'</td>'+
        '<td class="num">'+(any?usd(c,0):'—')+'</td><td class="num">'+usd(v,0)+'</td>'+
        '<td class="num '+(any?cls(g):'')+'">'+(any?sgn(g):'—')+'</td>'+
        '<td class="num '+(any&&c>0?cls(g):'')+'">'+(any&&c>0?pct(g/c*100):'—')+'</td>'+
        '<td class="num">'+(m.total?(v/m.total*100).toFixed(1)+'%':'—')+'</td><td class="num">—</td></tr>';
    }
  }
  group(m.groups.sol,'Kamino · Solana · SOL lending');
  group(m.groups.stable,'Kamino · Solana · stablecoin lending');
  group(m.groups.beefy,'Beefy · BNB Chain · concentrated liquidity');
  group(m.groups.other,'Other');
  var gTot=m.haveBasis?m.total-m.cost:null;
  return '<div class="card"><div class="scroll"><table style="min-width:900px">'+
    '<thead><tr><th>Position</th><th>Cost</th><th>Value</th><th>Gain</th><th>Gain %</th><th>Share</th><th>APY</th></tr></thead>'+
    '<tbody>'+rows+'</tbody>'+
    '<tfoot><tr><td>Book total</td><td class="num">'+(m.haveBasis?usd(m.cost,0):'—')+'</td>'+
    '<td class="num">'+usd(m.total,0)+'</td>'+
    '<td class="num '+(gTot!=null?cls(gTot):'')+'">'+(gTot!=null?sgn(gTot):'—')+'</td>'+
    '<td class="num '+(gTot!=null?cls(gTot):'')+'">'+(gTot!=null&&m.cost>0?pct(gTot/m.cost*100):'—')+'</td>'+
    '<td class="num">100%</td><td class="num">—</td></tr></tfoot></table></div></div>';
}

function pairCards(m){
  var list=m.groups.beefy.filter(function(p){return p.tokens&&p.tokens.length===2;});
  if(!list.length)return '';
  return '<div class="pairs">'+list.map(function(p){
    var t0=p.tokens[0],t1=p.tokens[1];
    var v0=t0.usd||0,v1=t1.usd||0,tot=v0+v1;
    var s0=tot>0?v0/tot*100:50, s1=100-s0;
    var rng='';
    if(p.rangeLo!=null&&p.rangeHi!=null&&p.price!=null){
      var posn=Math.max(0,Math.min(1,p.rangePos!=null?p.rangePos:0))*100;
      rng='<div class="rng"><div class="rng-rail"></div>'+
        '<div class="rng-now" style="left:'+posn.toFixed(1)+'%" data-tip="'+esc('Current '+sig(p.price)+' — '+posn.toFixed(1)+'% up the range, '+(p.inRange?'in range':'OUT OF RANGE'))+'"></div></div>'+
        '<div class="rng-lab"><span>'+sig(p.rangeLo)+'</span><span style="color:var(--accent);font-weight:600">'+sig(p.price)+'</span><span>'+sig(p.rangeHi)+'</span></div>';
    }
    return '<div class="pair">'+
      '<div class="pair-h"><b>'+esc(p.name)+'</b><span>'+usd(p.value,0)+'</span></div>'+
      '<div class="pair-sub">'+esc([p.platform,p.kindLabel,(p.inRange==null?'':(p.inRange?'in range':'out of range'))].filter(Boolean).join(' · '))+'</div>'+
      '<div class="plab"><b style="color:var(--s1)">'+esc(t0.sym)+'</b><b style="color:var(--s2)">'+esc(t1.sym)+'</b></div>'+
      '<div class="split">'+
        '<div class="a" style="flex:'+s0.toFixed(2)+'" data-tip="'+esc(t0.sym+' · '+s0.toFixed(1)+'% · '+sig(t0.amt)+' '+t0.sym)+'">'+s0.toFixed(1)+'%</div>'+
        '<div class="b" style="flex:'+s1.toFixed(2)+'" data-tip="'+esc(t1.sym+' · '+s1.toFixed(1)+'% · '+sig(t1.amt)+' '+t1.sym)+'">'+s1.toFixed(1)+'%</div>'+
      '</div>'+
      '<div class="amts"><span>'+sig(t0.amt)+' '+esc(t0.sym)+' · '+usd(v0,0)+'</span><span>'+sig(t1.amt)+' '+esc(t1.sym)+' · '+usd(v1,0)+'</span></div>'+
      rng+
      '<div class="hold"><span>fee APY now</span><b>'+(p.apy!=null?(p.apy*100).toFixed(1)+'%':'not reported')+'</b></div>'+
    '</div>';
  }).join('')+'</div>';
}

function exposureCard(m){
  var rows=exposures(m);
  if(!rows.length)return '';
  var maxShare=Math.max.apply(null,rows.map(function(r){return r.usd/m.total;}));
  var axisMax=Math.min(1,Math.max(0.25,Math.ceil(maxShare*100/12.5)*12.5/100));
  var body=rows.map(function(r){
    var share=r.usd/m.total;
    return '<div class="bandrow">'+
      '<div class="slabel"><b>'+esc(r.name)+'</b><em>'+esc(r.notes.slice(0,2).join(', ')+(r.notes.length>2?' +'+(r.notes.length-2):''))+'</em></div>'+
      '<div class="meter"><div class="meter-rail"></div>'+
      '<div class="meter-now" style="left:'+Math.min(100,share/axisMax*100).toFixed(1)+'%" data-tip="'+esc(r.name+' '+(share*100).toFixed(2)+'% · '+usd(r.usd,0))+'"></div></div>'+
      '<div class="bandnum">'+usd(r.usd,0)+' · <b>'+(share*100).toFixed(1)+'%</b></div></div>';
  }).join('');
  var ax='<div class="dv-ax" style="grid-column:1/-1;margin-top:10px">'+[0,.25,.5,.75,1].map(function(f){return '<span>'+(axisMax*f*100).toFixed(1).replace(/\.0$/,'')+'%</span>';}).join('')+'</div>';
  return '<div class="card">'+body+ax+'</div>';
}

function apyCompare(m){
  var list=m.groups.beefy.filter(function(p){return p.apy!=null&&p.gainPct!=null;});
  if(list.length<2)return '';
  var mx=Math.max.apply(null,list.map(function(p){return Math.max(Math.abs(p.apy*100),Math.abs(p.gainPct));}));
  mx=Math.max(20,Math.min(200,Math.ceil(mx/10)*10));
  var body=list.map(function(p){
    var a=p.apy*100, r=p.gainPct;
    var aw=Math.min(50,Math.abs(a)/mx*50), rw=Math.min(50,Math.abs(r)/mx*50);
    return '<div class="slabel"><b>'+esc(p.name)+'</b><em>'+usd(p.cost,0)+' → '+usd(p.value,0)+'</em></div>'+
      '<div class="dv-track">'+
      '<div class="dv-bar up" style="width:'+aw.toFixed(1)+'%"></div><div class="dv-t up" style="left:calc(50% + '+aw.toFixed(1)+'% + 7px)">'+a.toFixed(1)+'%</div>'+
      '<div class="dv-bar dn" style="width:'+rw.toFixed(1)+'%"></div><div class="dv-t dn" style="right:calc(50% + '+rw.toFixed(1)+'% + 7px)">'+pct(r,1)+'</div>'+
      '</div>';
  }).join('');
  var ax='<div class="dv-ax"><span>−'+mx+'%</span><span>−'+(mx/2)+'%</span><span>0</span><span>+'+(mx/2)+'%</span><span>+'+mx+'%</span></div>';
  return '<div class="card"><ul class="legend"><li><span class="sw" style="background:var(--s1)"></span>Advertised APY</li>'+
    '<li><span class="sw" style="background:var(--crit)"></span>Realized return since deposit</li></ul>'+
    '<div class="dv">'+body+ax+'</div></div>';
}

function flags(m){
  var out=[];
  var byVal=m.pos.slice().sort(function(a,b){return (b.value||0)-(a.value||0);});
  var top=byVal[0];
  if(top&&m.total){
    var sh=top.value/m.total*100;
    if(sh>=20)out.push({t:'w',tag:'Concentration',h:'One position is '+sh.toFixed(0)+'% of the book',
      p:'<b>'+esc(top.name)+'</b> holds '+usd(top.value,0)+' of '+usd(m.total,0)+'. Everything that happens to that one vault moves the book more than anything else you own.'});
  }
  var oor=m.groups.beefy.filter(function(p){return p.inRange===false;});
  if(oor.length)out.push({t:'w',tag:'Out of range',h:oor.length+' Beefy position'+(oor.length>1?'s are':' is')+' outside its range',
    p:'<b>'+esc(oor.map(function(p){return p.name;}).join(', '))+'</b> — earning no fees at all while out of range, and fully converted into one side of the pair.'});
  var zero=m.groups.beefy.filter(function(p){return p.apy===0;});
  if(zero.length)out.push({t:'',tag:'No yield',h:zero.length+' Beefy vault'+(zero.length>1?'s are':' is')+' reporting 0% APY',
    p:esc(zero.map(function(p){return p.name;}).join(', '))+' — in range but paying nothing measurable right now, so the position is pure price exposure.'});
  if(m.haveBasis){
    var bg=m.sum(m.groups.beefy.filter(function(p){return p.gain!=null;}),function(p){return p.gain;});
    var kg=m.sum(m.groups.sol.concat(m.groups.stable).filter(function(p){return p.gain!=null;}),function(p){return p.gain;});
    if(bg<0&&kg>0){
      var eaten=Math.min(100,-bg/kg*100);
      var inc=m.sum(m.groups.beefy,function(p){return p.daily;});
      var days=inc>0?(-bg/inc):null;
      out.push({t:bg+kg>=0?'g':'w',tag:'The netting',h:eaten.toFixed(0)+'% of the Kamino gain has been spent on Beefy',
        p:'Kamino is up '+sgn(kg)+' and Beefy is down '+sgn(bg)+', leaving '+sgn(kg+bg)+' net.'+
          (days?' At Beefy’s current '+usd(inc,2)+' a day of fees, earning the loss back takes <b>'+Math.round(days).toLocaleString('en-US')+' days</b>.':'')});
    }
  }
  if(!out.length)return '';
  return '<div class="finds">'+out.map(function(f){
    return '<div class="find'+(f.t?' '+f.t:'')+'"><h3><span class="tag'+(f.t?'':' n')+'">'+esc(f.tag)+'</span>'+esc(f.h)+'</h3><p>'+f.p+'</p></div>';
  }).join('')+'</div>';
}

function section(title,eyebrow,lede,body){
  if(!body)return '';
  return '<section><div class="shead"><h2>'+esc(title)+'</h2>'+(eyebrow?'<span class="eyebrow">'+esc(eyebrow)+'</span>':'')+'</div>'+
    (lede?'<p class="lede">'+lede+'</p>':'')+body+'</section>';
}

function render(m,meta){
  var gTot=m.haveBasis?(m.total-m.cost):null;
  var kam=m.groups.sol.concat(m.groups.stable), bee=m.groups.beefy;
  var kamV=m.sum(kam,function(p){return p.value;}), beeV=m.sum(bee,function(p){return p.value;});
  var html='';
  html+='<header>'+
    '<div class="eyebrow">Live position review</div>'+
    '<h1>Two wallets, one book</h1>'+
    '<p class="sub">'+m.pos.length+' positions across Kamino on Solana and Beefy on BNB Chain, priced together — read live from both chains every time this page loads.</p>'+
    '<div class="stamp">'+
      (cfg.sol?'<span>Solana <b class="num">'+esc(shortAddr(cfg.sol))+'</b></span>':'')+
      (cfg.bnb?'<span>BNB Chain <b class="num">'+esc(shortAddr(cfg.bnb))+'</b></span>':'')+
      '<span>Read <b>'+esc(meta.when)+'</b></span>'+
      '<span><button id="btnRefresh">Refresh</button> <button id="btnCfg">Settings</button></span>'+
    '</div></header>';

  if(m.errs.length)html+='<div class="warnbox"><b>Partial read.</b> '+esc(m.errs.map(function(e){return e.name+' ('+e.error+')';}).join('; '))+'. Everything below excludes those.</div>';
  if(!m.haveBasis)html+='<div class="warnbox"><b>No cost basis stored yet.</b> Values and yields below are live; gain columns stay blank until you enter what each position cost in Settings.</div>';

  html+='<div class="tiles">'+
    tile('Book value',usd(m.total,0),'Kamino '+usd(kamV,0)+' · Beefy '+usd(beeV,0))+
    (gTot!=null?tile('Net position',sgn(gTot),'<b class="'+cls(gTot)+'">'+pct(gTot/m.cost*100)+'</b> on '+usd(m.cost,0)+' deployed',true,cls(gTot)):
      tile('Positions',String(m.pos.length),'across 2 chains',true))+
    tile('Daily income','~'+usd(m.daily,0),'at the yields showing right now')+
    tile('Venues',(kam.length?1:0)+(bee.length?1:0)+' / 2',kam.length+' Kamino · '+bee.length+' Beefy')+
  '</div>';

  html+=section('The netting','Where the book actually stands',
    m.haveBasis?'Looked at one wallet at a time each venue tells its own story. Looked at together, this is the bridge from zero to your actual net position.':'',
    waterfall(m));
  html+=section('All positions',usd(m.total,0),'Every position with its live value, share of the book and the yield it is paying now. Cost and gain come from the basis you stored in this browser.',positionsTable(m));
  html+=section('Inside the pairs','Composition & range position','Each Beefy vault holds two assets and the split moves as the price ratio does. The dot on each rail is where the pool price sits inside the vault’s range right now.',pairCards(m));
  html+=section('What you actually own','Look-through by asset','Every position resolved into the assets underneath it, Beefy pairs broken into their two legs at current composition.',exposureCard(m));
  html+=section('Advertised versus realized','Beefy','Fee APY the vault is advertising now, against what each position has actually returned since you put money in.',apyCompare(m));
  html+=section('What stands out','','',flags(m));

  html+='<footer>'+
    '<p><b>Live, not a snapshot.</b> Kamino positions come from api.kamino.finance; Beefy positions are read from the vault contracts on BNB Chain through a public RPC node, with prices from api.beefy.finance. Nothing is cached — a reload re-reads everything.</p>'+
    '<p><b>What is stored, and where.</b> Your two addresses and your cost basis live in this browser’s local storage only. They are not in the repository this page is served from, and this page has no backend to send them to.</p>'+
    '<p><b>Limits.</b> Cost basis is what you typed, so gains are only as right as that. Beefy’s hold-versus-LP comparison is not available from a public endpoint and is not shown. Yields are annualized rates that move constantly, not a forecast.</p>'+
    '<p><b>Not advice.</b> This is a read of position data — not investment advice, and blind to your tax position, time horizon and everything outside these two wallets.</p>'+
  '</footer>';

  app.innerHTML=html;
  document.getElementById('btnRefresh').onclick=function(){run(true);};
  document.getElementById('btnCfg').onclick=function(){openSettings(m);};
  wireTips();
}

function wireTips(){
  var tip=document.getElementById('tip');
  function move(e){var r=tip.getBoundingClientRect();var x=e.clientX+14,y=e.clientY-r.height-10;
    if(x+r.width>window.innerWidth-8)x=window.innerWidth-r.width-8; if(y<8)y=e.clientY+18;
    tip.style.left=x+'px';tip.style.top=y+'px';}
  document.querySelectorAll('[data-tip]').forEach(function(elm){
    elm.addEventListener('mouseenter',function(e){var t=e.currentTarget.getAttribute('data-tip');if(!t)return;tip.textContent=t;tip.style.opacity='1';move(e);});
    elm.addEventListener('mousemove',move);
    elm.addEventListener('mouseleave',function(){tip.style.opacity='0';});
  });
}

/* ---------------- settings ---------------- */
function openSettings(m){
  var dlg=document.getElementById('settings'), f=document.getElementById('settingsForm');
  var rows=m.pos.map(function(p){
    return '<div class="lbl">'+esc(p.name)+'<br><span class="muted">'+esc(p.venue)+' · now '+usd(p.value,0)+'</span></div>'+
      '<input data-id="'+esc(p.id)+'" value="'+(cfg.basis[p.id]!=null?esc(cfg.basis[p.id]):'')+'" placeholder="cost $">';
  }).join('');
  f.innerHTML='<h2>Settings</h2>'+
    '<p class="muted">Everything here stays in this browser.</p>'+
    '<div class="field" style="margin-top:16px"><label>Solana wallet</label><input id="c_sol" value="'+esc(cfg.sol)+'"></div>'+
    '<div class="field"><label>BNB Chain wallet</label><input id="c_bnb" value="'+esc(cfg.bnb)+'"></div>'+
    '<div class="field"><label>Extra Kamino vault addresses (one per line)</label><textarea id="c_extra" style="min-height:70px">'+esc((cfg.extraKamino||[]).map(function(v){return typeof v==='string'?v:v.addr;}).join('\n'))+'</textarea></div>'+
    '<div class="field"><label>Cost basis</label><div class="basis-grid">'+rows+'</div></div>'+
    '<div class="field"><label>Backup / restore (JSON)</label><textarea id="c_json">'+esc(JSON.stringify({sol:cfg.sol,bnb:cfg.bnb,basis:cfg.basis,extraKamino:cfg.extraKamino},null,1))+'</textarea></div>'+
    '<div class="bar"><button type="button" id="c_derive">Estimate Kamino cost basis</button></div>'+
    '<p class="muted" id="c_status">Reads your Kamino deposit history and fills the fields above. '+
      'Beefy cannot be derived — its own indexer is unreachable from a browser and public BNB Chain nodes refuse historical queries, so those stay manual.</p>'+
    '<div class="bar"><button class="primary" id="c_save" value="save">Save &amp; reload</button>'+
    '<button id="c_close" value="cancel">Cancel</button>'+
    '<button id="c_rescan" value="rescan">Rescan Beefy vaults</button>'+
    '<button id="c_wipe" value="wipe">Forget everything</button></div>';
  dlg.showModal();
  f.querySelector('#c_save').onclick=function(){
    cfg.sol=f.querySelector('#c_sol').value.trim();
    cfg.bnb=f.querySelector('#c_bnb').value.trim();
    cfg.extraKamino=f.querySelector('#c_extra').value.split(/\s+/).filter(Boolean);
    var js=f.querySelector('#c_json').value.trim(), applied=false;
    try{ var o=JSON.parse(js);
      if(o&&(o.basis||o.sol||o.bnb)&&js!==JSON.stringify({sol:cfg.sol,bnb:cfg.bnb,basis:cfg.basis,extraKamino:cfg.extraKamino},null,1)){
        if(o.sol)cfg.sol=o.sol; if(o.bnb)cfg.bnb=o.bnb; if(o.basis)cfg.basis=o.basis;
        if(o.extraKamino)cfg.extraKamino=o.extraKamino; applied=true; }
    }catch(e){}
    if(!applied){ f.querySelectorAll('[data-id]').forEach(function(i){
      var v=i.value.replace(/[$,\s]/g,''); var id=i.getAttribute('data-id');
      if(v===''){delete cfg.basis[id];} else if(isFinite(Number(v))){cfg.basis[id]=Number(v);} }); }
    saveCfg(cfg); setTimeout(function(){run(true);},0);
  };
  f.querySelector('#c_derive').onclick=async function(){
    var st=f.querySelector('#c_status');
    if(!cfg.sol){ st.textContent='Add your Solana address first \u2014 there is nothing to read without it.'; return; }
    st.textContent='Reading Kamino cost basis\u2026';
    var out;
    try{ out=await deriveKaminoBasis(cfg.sol,kaminoRegistry(),function(i,n,name){
      st.textContent='Reading '+(i+1)+' of '+n+' \u2014 '+name; }); }
    catch(e){ st.textContent='Could not read it: '+String(e.message||e); return; }
    var exact=0,est=0,warn=[],changed=[];
    Object.keys(out).forEach(function(id){
      var r=out[id]; if(!r||!(r.cost>0))return;
      var inp=f.querySelector('[data-id="'+id+'"]');
      if(!inp)return;
      var was=Number(String(inp.value).replace(/[$,\s]/g,''));
      var now=Math.round(r.cost);
      if(isFinite(was)&&was>0&&Math.abs(now-was)/was>0.1)changed.push(r.name+': '+usd(was,0)+' \u2192 '+usd(now,0));
      inp.value=now;
      if(r.method==='kamino')exact++; else { est++; if(r.openingBalance)warn.push(r.name); }
    });
    if(!exact&&!est){ st.textContent='Nothing came back \u2014 no Kamino history for this wallet.'; return; }
    var msg='Filled <b>'+(exact+est)+'</b> position'+((exact+est)===1?'':'s')+'. ';
    if(exact)msg+=exact+' from Kamino\u2019s own deposit accounting. ';
    if(est)msg+=est+' rebuilt from daily balance history, because Kamino reports no basis for '+(est===1?'it':'them')+'. ';
    if(warn.length)msg+='<br>Treat '+esc(warn.join(', '))+' as approximate: the history opens with a balance already in place, so the first deposit is priced on the day the record starts rather than the day you actually bought. ';
    if(changed.length)msg+='<br><b>Moved by more than 10% from what you had:</b> '+esc(changed.join(' \u00b7 '))+'. Kamino\u2019s reported basis is not always stable, so keep your own figure if you trust it more. ';
    msg+='<br>Edit anything that looks wrong, then Save &amp; reload.';
    st.innerHTML=msg;
  };
  f.querySelector('#c_rescan').onclick=function(){cfg.beefyIds=null;saveCfg(cfg);setTimeout(function(){run(true);},0);};
  f.querySelector('#c_wipe').onclick=function(){ try{localStorage.removeItem(CFG_KEY);}catch(e){} cfg={sol:'',bnb:'',basis:{},extraKamino:[],beefyIds:null}; setTimeout(function(){renderSetup();},0); };
}

/* ---------------- boot ---------------- */
async function run(){
  if(!cfg.sol&&!cfg.bnb)return renderSetup();
  app.innerHTML='<div class="state"><span class="spin"></span>Reading Kamino and Beefy…</div>';
  var kam=[],bee=[];
  var jobs=[];
  if(cfg.sol)jobs.push(loadKamino(cfg.sol).then(function(r){kam=r;}).catch(function(e){kam=[{id:'kamino',error:String(e.message||e),name:'Kamino',venue:'Kamino'}];}));
  if(cfg.bnb)jobs.push(loadBeefy(cfg.bnb).then(function(r){bee=r;}).catch(function(e){bee=[{id:'beefy',error:String(e.message||e),name:'Beefy',venue:'Beefy'}];}));
  await Promise.all(jobs);
  var m=build(kam,bee);
  if(!m.pos.length&&m.errs.length){
    app.innerHTML='<div class="setup"><h2>Nothing came back</h2><p class="lede">Both reads failed: '+esc(m.errs.map(function(e){return e.error;}).join('; '))+'</p><div class="bar"><button class="primary" id="again">Try again</button></div></div>';
    document.getElementById('again').onclick=function(){run(true);}; return;
  }
  render(m,{when:new Date().toLocaleString(undefined,{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})});
}
window.addEventListener('DOMContentLoaded',function(){run();});
if(document.readyState!=='loading')run();
})();
</script>
</body>
</html>
